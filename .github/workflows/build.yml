name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Generate icon.ico from icon.png (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = [System.Drawing.Image]::FromFile((Resolve-Path "resources\icon.png"))
          $bmp = New-Object System.Drawing.Bitmap($png, 256, 256)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = New-Object System.IO.FileStream("resources\icon.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose()
          $bmp.Dispose()
          $png.Dispose()

      - name: Generate icon.icns from icon.png (macOS)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p resources/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size resources/icon.png --out resources/icon.iconset/icon_${size}x${size}.png
          done
          sips -z 32  32  resources/icon.png --out resources/icon.iconset/icon_16x16@2x.png
          sips -z 64  64  resources/icon.png --out resources/icon.iconset/icon_32x32@2x.png
          sips -z 256 256 resources/icon.png --out resources/icon.iconset/icon_128x128@2x.png
          sips -z 512 512 resources/icon.png --out resources/icon.iconset/icon_256x256@2x.png
          sips -z 1024 1024 resources/icon.png --out resources/icon.iconset/icon_512x512@2x.png
          iconutil -c icns resources/icon.iconset -o resources/icon.icns
          rm -rf resources/icon.iconset

      - name: Install dependencies
        run: npm ci

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: npm run dist -- --win --publish never

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: npm run dist -- --mac --publish never

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist -- --linux --publish never

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            dist/PDFDecomposer-Setup-*.exe
            dist/PDFDecomposer-portable.exe
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist/PDFDecomposer-*.dmg
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/PDFDecomposer-*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
