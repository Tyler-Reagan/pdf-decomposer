name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Generate icon.ico from icon.png (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = [System.Drawing.Image]::FromFile((Resolve-Path "resources\icon.png"))
          $bmp = New-Object System.Drawing.Bitmap($png, 256, 256)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = New-Object System.IO.FileStream("resources\icon.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose()
          $bmp.Dispose()
          $png.Dispose()

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      # Decide whether to sign, based purely on secret presence (only the
      # boolean result is interpolated — the secrets themselves never appear in
      # logs). macOS needs the full Developer ID + notarization set; Windows
      # needs the code-signing cert. When absent, the build falls back to the
      # existing unsigned path with no behavior change.
      - name: Detect signing secrets
        id: sign
        shell: bash
        run: |
          echo "mac=${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"
          echo "win=${{ secrets.WIN_CSC_LINK != '' }}" >> "$GITHUB_OUTPUT"

      # macOS signed + notarized. Signing flags are passed as -c overrides (not
      # baked into electron-builder.yml) so the unsigned fallback below stays
      # exactly the current build — important because hardenedRuntime on an
      # unsigned app would break launch.
      - name: Build (macOS, signed + notarized)
        if: matrix.platform == 'mac' && steps.sign.outputs.mac == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --mac --publish never -c.mac.hardenedRuntime=true -c.mac.gatekeeperAssess=false -c.mac.notarize=true

      - name: Build (macOS, unsigned)
        if: matrix.platform == 'mac' && steps.sign.outputs.mac != 'true'
        run: npm run dist -- --mac --publish never

      # Windows signed. electron-builder reads WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
      # automatically (a base64 .pfx/.p12 and its password).
      - name: Build (Windows, signed)
        if: matrix.platform == 'win' && steps.sign.outputs.win == 'true'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist -- --win --publish never

      - name: Build (Windows, unsigned)
        if: matrix.platform == 'win' && steps.sign.outputs.win != 'true'
        run: npm run dist -- --win --publish never

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist -- --linux --publish never

      # latest*.yml are emitted by electron-builder (see publish: in
      # electron-builder.yml) — no hand-rolled manifest step. Blockmaps ship
      # alongside each installer so electron-updater can do differential updates.
      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: dist-win
          path: |
            dist/PDFDecomposer-Setup-*.exe
            dist/PDFDecomposer-Setup-*.exe.blockmap
            dist/PDFDecomposer-*-portable.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: |
            dist/PDFDecomposer-*.dmg
            dist/PDFDecomposer-*.dmg.blockmap
            dist/PDFDecomposer-*.zip
            dist/PDFDecomposer-*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            dist/PDFDecomposer-*.AppImage
            dist/PDFDecomposer-*.AppImage.blockmap
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
