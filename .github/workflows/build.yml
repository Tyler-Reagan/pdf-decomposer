name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Generate icon.ico from icon.png (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $png = [System.Drawing.Image]::FromFile((Resolve-Path "resources\icon.png"))
          $bmp = New-Object System.Drawing.Bitmap($png, 256, 256)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = New-Object System.IO.FileStream("resources\icon.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose()
          $bmp.Dispose()
          $png.Dispose()

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Build and publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
