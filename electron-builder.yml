appId: com.pdfdecomposer.app
productName: PDF Decomposer
copyright: Copyright © 2025 PDF Decomposer
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

extraResources:
  - from: resources/demo.pdf
    to: demo.pdf

win:
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    publisherName: PDF Decomposer
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  artifactName: PDFDecomposer-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: PDFDecomposer-${version}-portable.exe

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns

dmg:
  artifactName: PDFDecomposer-${version}-${arch}.dmg

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: resources/icon.png

appImage:
  artifactName: PDFDecomposer-${version}.AppImage
