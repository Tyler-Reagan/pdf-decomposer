appId: com.pdfdecomposer.app
productName: PDF Decomposer
copyright: Copyright © 2025 PDF Decomposer
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

extraResources:
  - from: resources/demo.pdf
    to: demo.pdf

win:
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    publisherName: PDF Decomposer
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

# Assisted (non-one-click) installer, per-user by default. electron-builder's
# NSIS target keys off appId/productName to detect an existing install at the
# same location and replaces it in place — running Setup.exe for a new version
# over an old install upgrades it rather than creating a second copy, and
# leaves a single Add/Remove Programs entry for uninstalling.
nsis:
  artifactName: PDFDecomposer-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  uninstallDisplayName: PDF Decomposer
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  artifactName: PDFDecomposer-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns

dmg:
  artifactName: PDFDecomposer-${version}-${arch}.dmg

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: resources/icon.png

appImage:
  artifactName: PDFDecomposer-${version}.AppImage
