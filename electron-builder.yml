appId: com.pdfdecomposer.app
productName: PDF Decomposer
copyright: Copyright © 2025 PDF Decomposer
directories:
  buildResources: resources
  output: dist

# Drives electron-builder's auto-update metadata: with a publish provider set it
# emits latest.yml / latest-mac.yml / latest-linux.yml (referencing the update
# artifacts, blockmaps, and both macOS arches) and bakes app-update.yml into the
# app. Builds run with `--publish never`, so nothing is uploaded here — the
# workflow publishes the release — but the manifests are generated locally.
publish:
  provider: github
  owner: Tyler-Reagan
  repo: pdf-decomposer

files:
  - out/**/*

extraResources:
  - from: resources/demo.pdf
    to: demo.pdf

win:
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    publisherName: PDF Decomposer
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  artifactName: PDFDecomposer-Setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: PDFDecomposer-${version}-portable.exe

mac:
  # zip is required alongside dmg: electron-updater applies macOS updates via
  # Squirrel.Mac, which consumes the zip (the dmg is download-only). artifactName
  # here names the zip (dmg has its own block below) to match the dmg convention.
  artifactName: PDFDecomposer-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: resources/icon.icns

dmg:
  artifactName: PDFDecomposer-${version}-${arch}.dmg

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: resources/icon.png

appImage:
  artifactName: PDFDecomposer-${version}.AppImage
